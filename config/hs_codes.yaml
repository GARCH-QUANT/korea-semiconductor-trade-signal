      name: "반도체 보울·웨이퍼·디바이스 제조용 기계"
      class: "84类"
  semiconductor_devices:
    - code: "8541"
      name: "반도체 디바이스（다이오드·트랜지스터等）"
      class: "85类"
  integrated_circuits:
    - code: "8542"
      name: "전자집적회로"
      class: "85类"
  storage_media:
    - code: "8523"
      name: "비휘발성 기억장치（디스크·테이프·솔리드 스테이트）"
      class: "85类"
  display_modules:
    - code: "8524"
      name: "평판디스플레이 모듈"
      class: "85类"
  computers:
    - code: "8471"
      name: "자동자료처리기기"
      class: "84类"
  computer_parts:
    - code: "8473"
      name: "8470-8472용 부품·부속품"
      class: "84类"
  electrical_control:
    - code: "8537"
      name: "전기제어용 보드·패널·콘솔"
      class: "85类"

# ============================================================
# 编码池版本记录规范
# ============================================================
versioning_rules:
  trigger_fields:
    - 编码增删
    - 单位变更（EA→KG等）
    - 口径定义变化
    - 数据源字段重命名
  output_format: |
    每次变更须在version_history新增一条记录：
    - date: "YYYY-MM"
    - change: "变更描述"
    - reason: "变更原因"
